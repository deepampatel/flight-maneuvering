services:
  intercept:
    build:
      context: .
      args:
        VITE_GOOGLE_MAPS_API_KEY: "${VITE_GOOGLE_MAPS_API_KEY:-}"
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - PYTHONPATH=/app:/app/backend
    volumes:
      - recordings:/app/backend/recordings
    restart: unless-stopped

volumes:
  recordings:
